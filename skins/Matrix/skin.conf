###############################################################################
# MATRIX SKIN CONFIGURATION FILE                                            #
# A WeeWX theme inspired by "The Matrix" and hacker/terminal aesthetics.    #
# Green phosphor, digital rain, and a fully-featured historical archive.    #
###############################################################################

SKIN_NAME = Matrix
SKIN_VERSION = 1.1.0

###############################################################################

# Extra tags made available to the templates as $Extras.xxxx

[Extras]

    # Uncomment and set to overlay a "SYSTEM: " tagline in the title bar.
    #tagline = FOLLOW THE WHITE RABBIT

    # If you have a Google Analytics GA4 tag, uncomment and edit the next
    # line to include analytics on generated pages.
    #googleAnalyticsId = G-ABCDEFGHI

    # Interactive shell in the title bar (Matrix mode only).
    enable_shell = true

    # Default theme: matrix (full effects) or safe (static, accessible).
    default_theme = matrix

    # Days of daily summaries exported to shell-data.json for shell commands.
    shell_history_days = 120

    # Display name for hardware on the About page, in JSON exports, and in the
    # shell (overrides $station.hardware, e.g. when using MQTTSubscribe).
    #hardware_name = Ambient Weather WS-2902

    # Bluesky / ATProto profile URL; if set, an ATPROTO link appears in the nav.
    #atproto = https://bsky.app/profile/example.bsky.social

###############################################################################

# Options that control which observations and plots appear, and in what
# order. These can be overridden in weewx.conf without touching this file.

[DisplayOptions]

    # Observations shown in the "CURRENT_CONDITIONS" readout on the
    # dashboard, in order.
    observations_current = outTemp, dewpoint, windchill, heatindex, outHumidity, barometer, windSpeed, windGust, rain, rainRate, inTemp, inHumidity

    # Observations considered "extended" telemetry: sensors that not every
    # station has (UV, solar radiation, particulate/air-quality, lightning).
    # These are only displayed when the station actually reports data for
    # them -- the skin degrades gracefully when they are absent.
    observations_extended = UV, radiation, pm1_0, pm2_5, pm10_0, lightning_strike_count, lightning_distance

    # Observations shown in the historical comparison table on the
    # HISTORY page (Day / Week / Month / Year columns).
    observations_stats = outTemp, dewpoint, windchill, heatindex, outHumidity, barometer, windSpeed, rain, rainRate, UV, radiation, pm1_0, pm2_5, pm10_0, lightning_strike_count, inTemp, inHumidity

    # Observations that should be displayed as a running total rather than
    # a min/max/avg triple.
    obs_type_sum = rain, lightning_strike_count

    # Observations that should be displayed as a max only.
    obs_type_max = rainRate, UV

    # Plot groups to generate/display. A group name is combined with a
    # period (day/week/month/year) to form a plot name, e.g. 'day' +
    # 'tempdew' = 'daytempdew', which must match a stanza in
    # [ImageGenerator] below.
    plot_groups = tempdew, tempfeel, hum, barometer, wind, winddir, rain, UV, radiation, aq, lightning, tempin, humin

    # Time spans used for the plot tabs on the HISTORY page.
    periods = day, week, month, year

    # Show a link to the RSS feed?
    show_rss = True

###############################################################################

# The CheetahGenerator creates files from templates. This section specifies
# which files are generated from which templates.

[CheetahGenerator]

    encoding = html_entities

    [[SummaryByMonth]]
        # One page per calendar month, all the way back to the first
        # archive record -- the "deep archive" of the station's history.
        [[[archive_month]]]
            template = archive/month-%Y-%m.html.tmpl

    [[SummaryByYear]]
        # One page per calendar year.
        [[[archive_year]]]
            template = archive/year-%Y.html.tmpl

    [[ToDate]]
        # Pages that are regenerated every reporting cycle.
        [[[index]]]
            template = index.html.tmpl
        [[[history]]]
            template = history.html.tmpl
        [[[archive_index]]]
            template = archive.html.tmpl
        [[[about]]]
            template = about.html.tmpl
        [[[RSS]]]
            template = rss.xml.tmpl
        [[[shell_data]]]
            template = shell-data.json.tmpl
        [[[current_json]]]
            template = current.json.tmpl

###############################################################################

# The CopyGenerator copies static files into place.

[CopyGenerator]

    copy_always = static/*.css, static/*.js, static/*.svg
    copy_once = font/*.ttf

###############################################################################

# The ImageGenerator renders the plots used throughout the skin. The
# palette below is tuned for a black background with "phosphor green"
# traces, in keeping with the Matrix theme.

[ImageGenerator]

    image_width = 500
    image_height = 200
    image_background_color = "#000000"

    chart_background_color = "#000000"
    chart_gridline_color = "#0b3d0b"

    anti_alias = 2

    top_label_font_path = font/ShareTechMono-Regular.ttf
    top_label_font_size = 13
    top_label_font_color = "#00ff41"

    unit_label_font_path = font/ShareTechMono-Regular.ttf
    unit_label_font_size = 11
    unit_label_font_color = "#00b32d"

    bottom_label_font_path = font/ShareTechMono-Regular.ttf
    bottom_label_font_size = 10
    bottom_label_font_color = "#008022"
    bottom_label_offset = 3

    axis_label_font_path = font/ShareTechMono-Regular.ttf
    axis_label_font_size = 10
    axis_label_font_color = "#00b32d"

    rose_label = N
    rose_label_font_path = font/ShareTechMono-Regular.ttf
    rose_label_font_size = 9
    rose_label_font_color = "#00ff41"

    # Phosphor-green palette, with an amber accent (chart_line_colors[2])
    # reserved for a second/contrasting trace such as a dew point or gust.
    chart_line_colors = "#00ff41", "#39ff88", "#ffb000", "#00e5ff", "#ff2b2b"
    chart_fill_colors  = "#0b4d1a", "#0a3d14", "#4d3a00", "#003d40", "#4d0a0a"

    line_type = 'solid'
    marker_size = 6
    marker_type = 'none'

    yscale = None, None, None

    vector_rotate = 90

    line_gap_fraction = 0.05

    # Day/night shading -- kept subtle so it doesn't fight the black
    # background.
    show_daynight = true
    daynight_day_color = "#020402"
    daynight_night_color = "#000000"
    daynight_edge_color = "#062606"

    plot_type = line
    width = 1
    aggregate_type = none

    # Don't bother rendering a plot with nothing in it.
    skip_if_empty = year

    [[day_images]]
        x_label_format = %H:%M
        bottom_label_format = %x %X
        time_length = 27h

        [[[daytempdew]]]
            [[[[outTemp]]]]
            [[[[dewpoint]]]]

        [[[daytempfeel]]]
            [[[[windchill]]]]
            [[[[heatindex]]]]

        [[[dayhum]]]
            [[[[outHumidity]]]]

        [[[daybarometer]]]
            [[[[barometer]]]]

        [[[daywind]]]
            [[[[windSpeed]]]]
            [[[[windGust]]]]

        [[[daywinddir]]]
            yscale = 0.0, 360.0, 45.0
            line_type = None
            marker_type = box
            marker_size = 2
            [[[[windDir]]]]

        [[[dayrain]]]
            yscale = None, None, 0.02
            plot_type = bar
            [[[[rain]]]]
                aggregate_type = sum
                aggregate_interval = 1h
                label = Rain (hourly total)

        [[[dayUV]]]
            yscale = 0, 16, 1
            [[[[UV]]]]

        [[[dayradiation]]]
            [[[[radiation]]]]

        [[[dayaq]]]
            [[[[pm2_5]]]]
            [[[[pm10_0]]]]

        [[[daylightning]]]
            yscale = None, None, 1
            plot_type = bar
