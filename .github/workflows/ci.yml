name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch bundled fonts
        run: bash scripts/fetch-fonts.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile Python
        run: python -m compileall -q install.py tests

      - name: Run validation tests
        run: python -m unittest discover -s tests -t tests -v

  install:
    name: weectl extension install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch bundled fonts
        run: bash scripts/fetch-fonts.sh

      - name: Install WeeWX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create a scratch station
        run: |
          weectl station create "$RUNNER_TEMP/station" --no-prompt \
            --driver=weewx.drivers.simulator --location="CI Station" \
            --latitude=45.551234 --longitude=-122.671234 --altitude="200, foot" \
            --units=us

      - name: Install the extension
        run: weectl extension install . -y --config="$RUNNER_TEMP/station/weewx.conf"

      - name: Check the installation
        run: |
          weectl extension list --config="$RUNNER_TEMP/station/weewx.conf"
          grep -q '\[\[MatrixReport\]\]' "$RUNNER_TEMP/station/weewx.conf"
          test -f "$RUNNER_TEMP/station/skins/Matrix/skin.conf"
          test -f "$RUNNER_TEMP/station/skins/Matrix/static/matrix.css"

      - name: Seed archive data for report generation
        run: |
          timeout 3 weewxd --config="$RUNNER_TEMP/station/weewx.conf" || true
          DB="$RUNNER_TEMP/station/archive/weewx.sdb"
          NOW=$(date +%s)
          for OFFSET in $(seq 0 3600 172800); do
            TS=$((NOW - OFFSET))
            sqlite3 "$DB" "INSERT OR IGNORE INTO archive (dateTime, usUnits, interval, outTemp, outHumidity, barometer, windSpeed, windDir, rain, rainRate, dewpoint, windGust, pressure) VALUES ($TS, 1, 5, 72.5, 55.0, 30.05, 8.5, 180.0, 0.01, 0.0, 55.0, 12.0, 30.05);"
          done
          timeout 15 weewxd --config="$RUNNER_TEMP/station/weewx.conf" || true

      - name: Generate a report
        run: weectl report run MatrixReport --config="$RUNNER_TEMP/station/weewx.conf"

      - name: Validate generated shell data and light plots
        run: |
          HTML_ROOT="$RUNNER_TEMP/station/public_html"
          python -m json.tool "$HTML_ROOT/shell-data.json" > /dev/null
          python -m json.tool "$HTML_ROOT/current.json" > /dev/null
          test -f "$HTML_ROOT/index.html"
          test -f "$HTML_ROOT/static/shell.js"
          ls "$HTML_ROOT"/daytempdew.png "$HTML_ROOT"/daytempdew_light.png

      - name: Uninstall cleanly
        run: |
          weectl extension uninstall weewx-matrix -y --config="$RUNNER_TEMP/station/weewx.conf"
          weectl extension list --config="$RUNNER_TEMP/station/weewx.conf" | grep -qi weewx-matrix && exit 1 || true
          ! grep -q '\[\[MatrixReport\]\]' "$RUNNER_TEMP/station/weewx.conf"
          test ! -d "$RUNNER_TEMP/station/bin/user/installer/weewx-matrix"

  package:
    name: build release archive
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [validate, install]
    steps:
      - uses: actions/checkout@v6

      - name: Fetch bundled fonts
        run: bash scripts/fetch-fonts.sh

      - name: Create extension zip
        run: |
          mkdir -p dist
          VERSION=$(python -c "import ast; tree=ast.parse(open('install.py').read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(t, 'id', None) == 'VERSION' for t in node.targets)))")
          ARCHIVE="dist/weewx-matrix-${VERSION}.zip"
          rm -f "$ARCHIVE"
          zip -r "$ARCHIVE" . \
            -x '*.git*' -x 'dist/*' -x '.venv/*' -x '__pycache__/*' -x '*.pyc'
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          unzip -l "$ARCHIVE" | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: weewx-matrix-extension
          path: dist/*.zip
